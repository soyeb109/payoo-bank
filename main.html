<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@2.6.0/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-800">
    <section class="max-w-md min-h-screen mx-auto p-6 bg-gray-200">
      <header>
        <nav class="flex justify-around items-center">
          <img class="w-16" src="./assets/Group.png" alt="" />
          <div>
            <h1 class="text-3xl font-bold">
              $ <span id="main-balance">4343</span>
            </h1>
            <p class="border rounded p-1">Available Balance</p>
          </div>
          <button>Log out</button>
        </nav>
        <section class="mt-10">
          <h1 class="text-2xl font-bold mb-2">Welcome to Payoo!</h1>
          <p>
            Enjoy easy and convinient financial services with us.Cashout charge
            is low and
          </p>

          <div class="cards grid grid-cols-3 mt-14 gap-2 p-2">
            <div class="box cursor-pointer border p-4 text-center rounded-sm">
              <img class="w-8 mx-auto" src="./assets/wallet1.png" alt="" />
              <h3>Add Money</h3>
            </div>
            <div class="box border p-4 text-center rounded-sm">
              <img class="w-8 mx-auto" src="./assets/money1.png" alt="" />
              <h3>Cashout</h3>
            </div>
            <div class="box border p-4 text-center rounded-sm">
              <img class="w-8 mx-auto" src="./assets/purse1.png" alt="" />
              <h3>Transfer Money</h3>
            </div>
            <div class="box border p-4 text-center rounded-sm">
              <img class="w-8 mx-auto" src="./assets/wallet1.png" alt="" />
              <h3>Get Bonus</h3>
            </div>
            <div class="box border p-4 text-center rounded-sm">
              <img class="w-8 mx-auto" src="./assets/bonus1.png" alt="" />
              <h3>Pay Bills</h3>
            </div>
            <div class="box border p-4 text-center rounded-sm">
              <img class="w-8 mx-auto" src="./assets/transaction1.png" alt="" />
              <h3>Transaction History</h3>
            </div>
          </div>

          <section>
            <h2>Add Money</h2>
            <div class="">
              <div class="her-content flex-col lg:flex-row-reverse">
                <div class="card w-full max-w-sm shrink-0 shadow-2xl">
                  <form class="card-body">
                    <legend>Select Bank</legend>
                    <select class="select select-secondary w-full max-w-xs">
                      <option disabled selected>Select Your Bank</option>
                      <option value="BKash">BKash</option>
                      <option value="Nagad">Nagad</option>
                      <option value="DBBL">DBBL</option>
                    </select>
                    <div class="form-control">
                      <label class="label">
                        <span class="label-text">Account Number</span>
                      </label>
                      <input
                        id="account-number"
                        value="12345678901"
                        type="number"
                        maxlength="11"
                        placeholder="Enter your account number"
                        class="input input-bordered"
                        required
                      />
                      <label class="label">
                        <span class="label-text">Amount</span>
                      </label>
                      <input
                        id="amount"
                        type="number"
                        maxlength="11"
                        placeholder="Enter your Amount"
                        class="input input-bordered"
                        required
                      />
                    </div>
                    <div class="form-control">
                      <label class="label">
                        <span class="label-text">PIN</span>
                      </label>
                      <input
                        id="pin"
                        value="1234"
                        type="password"
                        placeholder="Enter your PIN"
                        class="input input-bordered"
                        required
                      />
                      <label class="label">
                        <a href="#" class="label-text-alt link link-hover"
                          >Forgot password?</a
                        >
                      </label>
                    </div>
                    <div class="form-control mt-6">
                      <button
                        id="add-money"
                        type="submit"
                        class="btn btn-primary"
                      >
                        Add Money
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>
        </section>
      </header>
    </section>

    <script src="./script/addMoney.js"></script>
  </body>
</html>
